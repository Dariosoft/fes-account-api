spring:
  application:
    name: account-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/accounts}
    username: ${DATABASE_USERNAME:accounts}
    password: ${DATABASE_PASSWORD:accounts-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:accounts}
    password: ${RABBITMQ_PASSWORD:accounts-local}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:friendly}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
fes:
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    session-cookie-domain: ${SESSION_COOKIE_DOMAIN:}
    browser-origins: ${BROWSER_ORIGINS:}
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
    public-api-base-url: ${PUBLIC_API_BASE_URL:}
